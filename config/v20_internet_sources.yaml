source_profile: v20_historical_internet_preview
network:
  enabled_by_default: false
  require_enable_network_flag: true
  cache_enabled: true
  cache_ttl_hours: 24
  rate_limit_seconds: 2
api_keys:
  football_data_api_key_env: FOOTBALL_DATA_API_KEY
  api_football_key_env: APIFOOTBALL_KEY
  odds_api_key_env: THE_ODDS_API_KEY
sources:
  football_data:
    enabled: true
    requires_network: true
    requires_api_key: false
    adapter: existing_or_http_csv
  understat:
    enabled: true
    requires_network: true
    requires_api_key: false
    adapter: existing_understat_provider_or_cache
    rules:
      - cache_required
      - rate_limit_required
      - no_login
      - no_paywall
      - no_captcha_bypass
  api_football:
    enabled: false
    requires_network: true
    requires_api_key: true
    adapter: api_football_future
  odds_api:
    enabled: false
    requires_network: true
    requires_api_key: true
    adapter: odds_api_future
